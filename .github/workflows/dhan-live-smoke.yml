name: Dhan live instrument-master smoke test

on:
  push:
    branches: ["feature/dhan-contract-validation"]
    paths:
      - ".github/workflows/dhan-live-smoke.yml"
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Retry live Dhan downloads and validate CSV mapping
        run: |
          python - <<'PY'
          import time
          from collections import Counter
          import httpx
          from app.data.dhan_master_client import (
              COMPACT_MASTER_URL, DETAILED_MASTER_URL, download_instrument_master,
          )

          for label, detailed, url in [
              ("detailed", True, DETAILED_MASTER_URL),
              ("compact", False, COMPACT_MASTER_URL),
          ]:
              last_error = None
              for attempt in range(1, 4):
                  try:
                      with httpx.Client(timeout=30, follow_redirects=True) as client:
                          rows = download_instrument_master(detailed=detailed, client=client)
                      if not rows:
                          raise RuntimeError("download parsed zero supported instruments")
                      counts = Counter(row.exchange_segment for row in rows)
                      print(f"PASS {label}: parsed {len(rows)} instruments; segments={dict(counts)}")
                      last_error = None
                      break
                  except Exception as exc:
                      last_error = exc
                      print(f"Attempt {attempt}/3 for {label} failed: {type(exc).__name__}: {exc}")
                      if attempt < 3:
                          time.sleep(attempt * 3)
              if last_error is not None:
                  raise SystemExit(f"FAIL {label} after 3 attempts: {last_error}")
          PY
